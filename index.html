<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #fff;
}


/* =====================================================
   CUSTOM JULIENNE LAUNCHER
   ===================================================== */

#julienneLauncher {
    position: fixed;

    right: 24px;
    bottom: 24px;

    z-index: 999999;

    display: flex;
    align-items: center;

    gap: 12px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =====================================================
   WHITE GREETING BUBBLE
   ===================================================== */

#julienneGreeting {
    position: relative;

    width: 210px;

    box-sizing: border-box;

    padding: 13px 14px;

    background: #ffffff;

    color: #241b1d;

    font-size: 14px;
    font-weight: 400;
    line-height: 1.35;

    border-radius: 14px;

    box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.12);

    cursor: pointer;
}


/* Speech bubble tail */

#julienneGreeting::after {
    content: "";

    position: absolute;

    right: 28px;
    bottom: -10px;

    width: 0;
    height: 0;

    border-top: 11px solid #ffffff;
    border-left: 11px solid transparent;
}


/* =====================================================
   CLOSE BUTTON
   ===================================================== */

#julienneClose {
    position: absolute;

    top: -8px;
    right: -8px;

    width: 20px;
    height: 20px;

    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 50%;

    background: #c8102e;
    color: #ffffff;

    font-family: Arial, sans-serif;

    font-size: 17px;
    font-weight: 300;
    line-height: 1;

    cursor: pointer;
}


/* =====================================================
   RED BOT BUTTON
   ===================================================== */

#julienneIcon {
    width: 62px;
    height: 62px;

    padding: 0;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 50%;

    background: #c8102e;

    cursor: pointer;
}


/* Bot image */

#julienneIcon svg {
    width: 31px;
    height: 31px;

    stroke: #ffffff;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 768px) {

    #julienneLauncher {
        right: 14px;
        bottom: 18px;

        gap: 10px;
    }


    #julienneGreeting {
        width: 200px;

        padding: 12px 14px;

        font-size: 13px;

        border-radius: 14px;
    }


    #julienneIcon {
        width: 58px;
        height: 58px;
    }


    #julienneIcon svg {
        width: 29px;
        height: 29px;
    }


    /* Salesforce chat window */

    .embeddedMessagingFrame {
        position: fixed !important;

        top: auto !important;

        bottom: 1rem !important;

        height: 70dvh !important;
        max-height: 70dvh !important;

        transform: translateY(4vh) !important;
    }


    .embeddedMessagingFrame iframe {
        height: 100% !important;
        max-height: 100% !important;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     JULIENNE CUSTOM LAUNCHER
     ===================================================== -->

<div id="julienneLauncher">


    <!-- White greeting -->

    <div
        id="julienneGreeting"
        role="button"
        tabindex="0"
        aria-label="Open Julienne AI Assistant"
    >

        <button
            id="julienneClose"
            type="button"
            aria-label="Close greeting"
        >
            ×
        </button>

        Hi there, are there any questions I can answer for you?

    </div>


    <!-- Red bot button -->

    <button
        id="julienneIcon"
        type="button"
        aria-label="Open Julienne AI Assistant"
    >

        <svg
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >

            <!-- Antenna -->

            <path
                d="M32 12V17"
                stroke-width="3"
                stroke-linecap="round"
            />

            <circle
                cx="32"
                cy="9"
                r="3"
                stroke-width="3"
            />


            <!-- Robot head -->

            <rect
                x="13"
                y="18"
                width="38"
                height="30"
                rx="11"
                stroke-width="3"
            />


            <!-- Eyes -->

            <circle
                cx="25"
                cy="32"
                r="3"
                fill="white"
                stroke="none"
            />

            <circle
                cx="39"
                cy="32"
                r="3"
                fill="white"
                stroke="none"
            />


            <!-- Mouth -->

            <path
                d="M25 41H39"
                stroke-width="3"
                stroke-linecap="round"
            />


            <!-- Bottom -->

            <path
                d="M23 49V54H41V49"
                stroke-width="3"
                stroke-linejoin="round"
            />

        </svg>

    </button>

</div>



<script>


const launcher =
    document.getElementById("julienneLauncher");


const greeting =
    document.getElementById("julienneGreeting");


const chatIcon =
    document.getElementById("julienneIcon");


const closeButton =
    document.getElementById("julienneClose");



const STORAGE_KEY =
    "fsc_chatCustomerInfo";


const REQUEST_INFO =
    "REQUEST_CHAT_CUSTOMER_INFO";


const RESPONSE_INFO =
    "CHAT_CUSTOMER_INFO_RESPONSE";


const SAVE_INFO =
    "SAVE_CHAT_CUSTOMER_INFO";



/* =====================================================
   CUSTOMER INFO FOR PRE-CHAT LWC
   ===================================================== */


window.addEventListener("message", event => {


    const data = event.data;


    if (!data || typeof data !== "object") {
        return;
    }



    /* Request stored customer information */

    if (data.type === REQUEST_INFO) {


        let customer = {};


        try {

            customer = JSON.parse(
                localStorage.getItem(STORAGE_KEY) || "{}"
            );

        }

        catch (e) {

            customer = {};

        }



        const firstName =
            String(customer.firstName || "").trim();


        const lastName =
            String(customer.lastName || "").trim();


        const email =
            String(customer.email || "").trim();


        const phone =
            String(customer.phone || "").trim();



        event.source?.postMessage(
            {

                type: RESPONSE_INFO,

                firstName,
                lastName,
                email,
                phone,

                isReturningCustomer:
                    !!(
                        firstName &&
                        lastName &&
                        email &&
                        phone
                    )

            },

            "*"
        );

    }



    /* Save customer information */

    if (data.type === SAVE_INFO) {


        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify({

                firstName:
                    String(data.firstName || "").trim(),

                lastName:
                    String(data.lastName || "").trim(),

                email:
                    String(data.email || "").trim(),

                phone:
                    String(data.phone || "").trim()

            })

        );

    }

});



/* =====================================================
   OPEN CHAT
   ===================================================== */


function openChat() {


    if (
        !embeddedservice_bootstrap
            ?.utilAPI
            ?.launchChat
    ) {
        return;
    }


    launcher.style.display = "none";


    embeddedservice_bootstrap
        .utilAPI
        .launchChat()

        .catch(() => {

            launcher.style.display = "flex";

        });

}



/* =====================================================
   HIDE SALESFORCE STANDARD BUTTON
   ===================================================== */


function hideSalesforceButton() {


    try {

        embeddedservice_bootstrap
            ?.utilAPI
            ?.hideChatButton();

    }

    catch (e) {}

}



/* =====================================================
   CUSTOM LAUNCHER EVENTS
   ===================================================== */


/* Greeting opens chat */

greeting.addEventListener(
    "click",
    openChat
);



/* Bot button opens chat */

chatIcon.addEventListener(
    "click",
    openChat
);



/* Keyboard support */

greeting.addEventListener(
    "keydown",
    event => {


        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            openChat();

        }

    }
);



/* X closes ONLY greeting */

closeButton.addEventListener(
    "click",
    event => {


        event.stopPropagation();


        greeting.style.display = "none";

    }
);



/* =====================================================
   SALESFORCE EVENTS
   ===================================================== */


window.addEventListener(
    "onEmbeddedMessagingButtonCreated",
    () => {


        hideSalesforceButton();


        launcher.style.display = "flex";

    }
);



window.addEventListener(
    "onEmbeddedMessagingReady",
    () => {


        hideSalesforceButton();


        launcher.style.display = "flex";


        setTimeout(
            hideSalesforceButton,
            500
        );


        setTimeout(
            hideSalesforceButton,
            1500
        );

    }
);



window.addEventListener(
    "onEmbeddedMessagingWindowOpened",
    () => {


        launcher.style.display = "none";

    }
);



window.addEventListener(
    "onEmbeddedMessagingWindowClosed",
    () => {


        setTimeout(() => {


            hideSalesforceButton();


            launcher.style.display = "flex";


        }, 100);

    }
);



/* =====================================================
   SALESFORCE INITIALIZATION
   ===================================================== */


function initEmbeddedMessaging() {


    try {


        embeddedservice_bootstrap
            .settings
            .language = "en_US";


        embeddedservice_bootstrap
            .settings
            .restrictSessionOnMessagingChannel = true;


        embeddedservice_bootstrap
            .settings
            .hideChatButtonOnLoad = true;



        embeddedservice_bootstrap.init(

            "00D6A000000w629",

            "Julienne_edu_1",

            "https://escoffier.my.site.com/ESWJulienneedu11787765871616",

            {

                scrt2URL:
                    "https://escoffier.my.salesforce-scrt.com"

            }

        );


    }

    catch (e) {


        console.error(
            "Error loading Embedded Messaging:",
            e
        );

    }

}


</script>



<!-- =====================================================
     SALESFORCE EMBEDDED MESSAGING
     ===================================================== -->


<script
    src="https://escoffier.my.site.com/ESWJulienneedu11787765871616/assets/js/bootstrap.min.js"
    onload="initEmbeddedMessaging()">
</script>


</body>

</html>
