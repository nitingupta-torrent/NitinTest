<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
        }
    </style>
	<style>

/* Mobile only */

@media only screen and (max-width: 768px) {

    .embeddedMessagingFrame {

        height: 70dvh !important;

        max-height: 70dvh !important;

        transform: translateY(8vh) !important;

    }

    .embeddedMessagingFrame iframe {

        height: 100% !important;

        max-height: 100% !important;

    }

}

</style>
	</head>

<body>
    <script type="text/javascript">
        const CUSTOMER_STORAGE_KEY = "fsc_chatCustomerInfo";
        const REQUEST_CUSTOMER_INFO = "REQUEST_CHAT_CUSTOMER_INFO";
        const CUSTOMER_INFO_RESPONSE = "CHAT_CUSTOMER_INFO_RESPONSE";
        const SAVE_CUSTOMER_INFO = "SAVE_CHAT_CUSTOMER_INFO";

        function getStoredCustomerInfo() {
            try {
                const storedValue = window.localStorage.getItem(
                    CUSTOMER_STORAGE_KEY
                );

                const customerInfo = storedValue
                    ? JSON.parse(storedValue)
                    : {};

                return {
                    firstName: String(
                        customerInfo.firstName || ""
                    ).trim(),

                    lastName: String(
                        customerInfo.lastName || ""
                    ).trim(),

                    email: String(
                        customerInfo.email || ""
                    ).trim(),

                    phone: String(
                        customerInfo.phone || ""
                    ).trim()
                };
            } catch (error) {
                console.error(
                    "Unable to read saved chat information:",
                    error
                );

                return {
                    firstName: "",
                    lastName: "",
                    email: "",
                    phone: ""
                };
            }
        }

        function isReturningCustomer(customerInfo) {
            return Boolean(
                customerInfo.firstName &&
                customerInfo.lastName &&
                customerInfo.email &&
                customerInfo.phone
            );
        }

        function saveCustomerInfo(messageData) {
            const customerInfo = {
                firstName: String(
                    messageData.firstName || ""
                ).trim(),

                lastName: String(
                    messageData.lastName || ""
                ).trim(),

                email: String(
                    messageData.email || ""
                ).trim(),

                phone: String(
                    messageData.phone || ""
                ).trim()
            };

            try {
                window.localStorage.setItem(
                    CUSTOMER_STORAGE_KEY,
                    JSON.stringify(customerInfo)
                );
            } catch (error) {
                console.error(
                    "Unable to save chat information:",
                    error
                );
            }
        }

        window.addEventListener("message", function (event) {
            const messageData = event.data;

            if (
                !messageData ||
                typeof messageData !== "object"
            ) {
                return;
            }

            if (
                messageData.type === REQUEST_CUSTOMER_INFO
            ) {
                const customerInfo =
                    getStoredCustomerInfo();

                const returningCustomer =
                    isReturningCustomer(customerInfo);

                if (
                    event.source &&
                    typeof event.source.postMessage ===
                        "function"
                ) {
                    event.source.postMessage(
                        {
                            type: CUSTOMER_INFO_RESPONSE,
                            firstName:
                                customerInfo.firstName,
                            lastName:
                                customerInfo.lastName,
                            email:
                                customerInfo.email,
                            phone:
                                customerInfo.phone,
                            isReturningCustomer:
                                returningCustomer
                        },
                        "*"
                    );
                }

                return;
            }

            if (
                messageData.type === SAVE_CUSTOMER_INFO
            ) {
                saveCustomerInfo(messageData);
            }
        });

        function initEmbeddedMessaging() {
            try {
                embeddedservice_bootstrap.settings.language = "en_US";
			    embeddedservice_bootstrap.settings.restrictSessionOnMessagingChannel = true;
                embeddedservice_bootstrap.init(
				'00D6A000000w629',
				'Julienne_edu_1',
				'https://escoffier.my.site.com/ESWJulienneedu11787765871616',
				{
					scrt2URL: 'https://escoffier.my.salesforce-scrt.com'
				}
			);
            } catch (err) {
                console.error(
                    "Error loading Embedded Messaging: ",
                    err
                );
            }
        }
    </script>
