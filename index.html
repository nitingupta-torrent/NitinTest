<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat</title>

    <style>

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
        }


        /* =====================================================
           CUSTOM JULIENNE LAUNCHER WRAPPER
           ===================================================== */

        #julienneLauncherWrapper {
            position: fixed;

            right: 24px;
            bottom: 24px;

            z-index: 999999;

            width: 150px;

            display: flex;
            flex-direction: column;
            align-items: stretch;

            /* Makes both sections appear as one box */
            border-radius: 18px;
            overflow: hidden;

            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.18);
        }


        /* =====================================================
           RED JULIENNE HEADER
           ===================================================== */

        #julienneLauncher {
            box-sizing: border-box;

            width: 100%;
            height: 36px;

            padding: 0 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;

            /*
             * Only TOP corners rounded.
             * Bottom is completely flat so it joins
             * directly to the white section.
             */
            border-radius: 18px 18px 0 0;

            background: #c8102e;
            color: #ffffff;

            cursor: pointer;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        #julienneLauncher:hover {
            background: #ad0d28;
        }


        .julienne-launcher-text {
            font-size: 13px;
            font-weight: 400;
            white-space: nowrap;
        }


        /* =====================================================
           WHITE GREETING SECTION
           ===================================================== */

        #julienneGreeting {
            box-sizing: border-box;

            width: 100%;

            /*
             * IMPORTANT:
             * No margin = no gap between red and white.
             */
            margin: 0;

            padding: 12px 14px;

            background: #ffffff;
            color: #222222;

            /*
             * Only BOTTOM corners rounded.
             */
            border-radius: 0 0 18px 18px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 12px;
            font-weight: 400;
            line-height: 1.4;

            cursor: pointer;
        }


        #julienneGreeting:hover {
            background: #f7f7f7;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media only screen and (max-width: 768px) {

            .embeddedMessagingFrame {
                position: fixed !important;

                bottom: 1rem !important;
                top: auto !important;

                height: 70dvh !important;
                max-height: 70dvh !important;

                transform:
                    translateY(4vh) !important;
            }


            .embeddedMessagingFrame iframe {
                height: 100% !important;
                max-height: 100% !important;
            }


            #julienneLauncherWrapper {
                right: 14px;
                bottom: 18px;

                width: 150px;
            }


            #julienneLauncher {
                height: 46px;

                padding: 0 12px;
            }


            .julienne-launcher-text {
                font-size: 12px;
                font-weight: 400;
            }


            #julienneGreeting {
                padding: 11px 13px;

                font-size: 11px;
                font-weight: 400;
            }
        }

    </style>
</head>


<body>


<!-- ==========================================================
     CUSTOM JULIENNE LAUNCHER
     ========================================================== -->

<div id="julienneLauncherWrapper">

    <button
        id="julienneLauncher"
        type="button"
        aria-label="Open Julienne AI Assistant"
    >

        <span class="julienne-launcher-text">
            Julienne AI Assistant
        </span>

    </button>


    <div
        id="julienneGreeting"
        role="button"
        tabindex="0"
        aria-label="Open Julienne AI Assistant"
    >
        Hi there! Are there any questions that I can answer for you?
    </div>

</div>



<script type="text/javascript">

    /* =====================================================
       CONSTANTS
       ===================================================== */

    const CUSTOMER_STORAGE_KEY =
        "fsc_chatCustomerInfo";

    const REQUEST_CUSTOMER_INFO =
        "REQUEST_CHAT_CUSTOMER_INFO";

    const CUSTOMER_INFO_RESPONSE =
        "CHAT_CUSTOMER_INFO_RESPONSE";

    const SAVE_CUSTOMER_INFO =
        "SAVE_CHAT_CUSTOMER_INFO";


    const wrapper =
        document.getElementById(
            "julienneLauncherWrapper"
        );


    const launcher =
        document.getElementById(
            "julienneLauncher"
        );


    const greeting =
        document.getElementById(
            "julienneGreeting"
        );


    /* =====================================================
       CUSTOMER STORAGE
       ===================================================== */

    function getStoredCustomerInfo() {

        try {

            const storedValue =
                window.localStorage.getItem(
                    CUSTOMER_STORAGE_KEY
                );


            const customerInfo =
                storedValue
                    ? JSON.parse(storedValue)
                    : {};


            return {

                firstName: String(
                    customerInfo.firstName || ""
                ).trim(),

                lastName: String(
                    customerInfo.lastName || ""
                ).trim(),

                email: String(
                    customerInfo.email || ""
                ).trim(),

                phone: String(
                    customerInfo.phone || ""
                ).trim()

            };


        } catch (error) {

            console.error(
                "Unable to read saved chat information:",
                error
            );


            return {
                firstName: "",
                lastName: "",
                email: "",
                phone: ""
            };
        }
    }


    function isReturningCustomer(customerInfo) {

        return Boolean(
            customerInfo.firstName &&
            customerInfo.lastName &&
            customerInfo.email &&
            customerInfo.phone
        );
    }


    function saveCustomerInfo(messageData) {

        const customerInfo = {

            firstName: String(
                messageData.firstName || ""
            ).trim(),

            lastName: String(
                messageData.lastName || ""
            ).trim(),

            email: String(
                messageData.email || ""
            ).trim(),

            phone: String(
                messageData.phone || ""
            ).trim()

        };


        try {

            window.localStorage.setItem(
                CUSTOMER_STORAGE_KEY,
                JSON.stringify(
                    customerInfo
                )
            );


        } catch (error) {

            console.error(
                "Unable to save chat information:",
                error
            );
        }
    }


    /* =====================================================
       PRECHAT COMMUNICATION
       ===================================================== */

    window.addEventListener(
        "message",
        function(event) {

            const messageData =
                event.data;


            if (
                !messageData ||
                typeof messageData !== "object"
            ) {
                return;
            }


            if (
                messageData.type ===
                REQUEST_CUSTOMER_INFO
            ) {

                const customerInfo =
                    getStoredCustomerInfo();


                const returningCustomer =
                    isReturningCustomer(
                        customerInfo
                    );


                if (
                    event.source &&
                    typeof event.source.postMessage ===
                        "function"
                ) {

                    event.source.postMessage(
                        {

                            type:
                                CUSTOMER_INFO_RESPONSE,

                            firstName:
                                customerInfo.firstName,

                            lastName:
                                customerInfo.lastName,

                            email:
                                customerInfo.email,

                            phone:
                                customerInfo.phone,

                            isReturningCustomer:
                                returningCustomer

                        },
                        "*"
                    );
                }


                return;
            }


            if (
                messageData.type ===
                SAVE_CUSTOMER_INFO
            ) {

                saveCustomerInfo(
                    messageData
                );
            }
        }
    );


    /* =====================================================
       SHOW / HIDE CUSTOM LAUNCHER
       ===================================================== */

    function showCustomLauncher() {

        wrapper.style.display =
            "flex";
    }


    function hideCustomLauncher() {

        wrapper.style.display =
            "none";
    }


    /* =====================================================
       HIDE SALESFORCE DEFAULT LAUNCHER
       ===================================================== */

    function hideSalesforceLauncher() {

        try {

            if (
                window.embeddedservice_bootstrap &&
                embeddedservice_bootstrap.utilAPI &&
                typeof embeddedservice_bootstrap
                    .utilAPI
                    .hideChatButton === "function"
            ) {

                embeddedservice_bootstrap
                    .utilAPI
                    .hideChatButton();

            }

        } catch (error) {

            console.log(
                "Salesforce launcher could not be hidden yet:",
                error
            );
        }
    }


    /* =====================================================
       OPEN CHAT
       USED BY BOTH RED + WHITE SECTIONS
       ===================================================== */

    function openJulienneChat() {

        try {

            if (
                window.embeddedservice_bootstrap &&
                embeddedservice_bootstrap.utilAPI &&
                typeof embeddedservice_bootstrap
                    .utilAPI
                    .launchChat === "function"
            ) {

                hideCustomLauncher();


                embeddedservice_bootstrap
                    .utilAPI
                    .launchChat()

                    .catch(
                        function(error) {

                            console.error(
                                "Unable to launch chat:",
                                error
                            );

                            showCustomLauncher();

                        }
                    );

            } else {

                console.log(
                    "Embedded Messaging is still loading."
                );
            }

        } catch (error) {

            console.error(
                "Unable to launch chat:",
                error
            );

            showCustomLauncher();

        }
    }


    /* =====================================================
       BOTH SECTIONS OPEN CHAT
       ===================================================== */

    launcher.addEventListener(
        "click",
        openJulienneChat
    );


    greeting.addEventListener(
        "click",
        openJulienneChat
    );


    greeting.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                openJulienneChat();

            }
        }
    );


    /* =====================================================
       SALESFORCE BUTTON CREATED
       ===================================================== */

    window.addEventListener(
        "onEmbeddedMessagingButtonCreated",
        function() {

            console.log(
                "Salesforce messaging button created."
            );


            hideSalesforceLauncher();

            showCustomLauncher();

        }
    );


    /* =====================================================
       EMBEDDED MESSAGING READY
       ===================================================== */

    window.addEventListener(
        "onEmbeddedMessagingReady",
        function() {

            console.log(
                "Embedded Messaging ready."
            );


            hideSalesforceLauncher();

            showCustomLauncher();


            setTimeout(
                function() {

                    hideSalesforceLauncher();

                },
                500
            );


            setTimeout(
                function() {

                    hideSalesforceLauncher();

                },
                1500
            );

        }
    );


    /* =====================================================
       CHAT WINDOW OPENED
       ===================================================== */

    window.addEventListener(
        "onEmbeddedMessagingWindowOpened",
        function() {

            console.log(
                "Messaging window opened."
            );


            hideCustomLauncher();

        }
    );


    /* =====================================================
       CHAT WINDOW CLOSED
       ===================================================== */

    window.addEventListener(
        "onEmbeddedMessagingWindowClosed",
        function() {

            console.log(
                "Messaging window closed."
            );


            setTimeout(
                function() {

                    hideSalesforceLauncher();

                    showCustomLauncher();

                },
                100
            );

        }
    );


    /* =====================================================
       INITIALIZE EMBEDDED MESSAGING
       ===================================================== */

    function initEmbeddedMessaging() {

        try {

            embeddedservice_bootstrap
                .settings
                .language =
                    "en_US";


            embeddedservice_bootstrap
                .settings
                .restrictSessionOnMessagingChannel =
                    true;


            embeddedservice_bootstrap
                .settings
                .hideChatButtonOnLoad =
                    true;


            embeddedservice_bootstrap.init(

                "00D6A000000w629",

                "Julienne_edu_1",

                "https://escoffier.my.site.com/ESWJulienneedu11787765871616",

                {

                    scrt2URL:
                        "https://escoffier.my.salesforce-scrt.com"

                }

            );


        } catch (err) {

            console.error(
                "Error loading Embedded Messaging:",
                err
            );
        }
    }

</script>


<script
    type="text/javascript"
    src="https://escoffier.my.site.com/ESWJulienneedu11787765871616/assets/js/bootstrap.min.js"
    onload="initEmbeddedMessaging()">
</script>


</body>
</html>
