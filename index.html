<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Salesforce Pre-Chat Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f4f6f9;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            background: #eef4ff;
            border-radius: 6px;
        }

        button {
            margin-top: 12px;
            margin-right: 8px;
            padding: 10px 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Embedded Messaging Test Page</h1>

        <p>
            Open the Salesforce chat, enter your first name,
            and click Start Chat.
        </p>

        <div class="status">
            Stored first name:
            <strong id="storedFirstName">None</strong>
        </div>

        <button
            type="button"
            onclick="showStoredFirstName()">
            Refresh Stored Value
        </button>

        <button
            type="button"
            onclick="clearStoredFirstName()">
            Clear Stored Value
        </button>
    </div>

    <script type="text/javascript">
        const CHAT_FIRST_NAME_KEY = 'chat_first_name';

        function showStoredFirstName() {
            const storedFirstName =
                localStorage.getItem(CHAT_FIRST_NAME_KEY);

            document.getElementById(
                'storedFirstName'
            ).textContent = storedFirstName || 'None';

            console.log(
                'Current stored first name:',
                storedFirstName
            );
        }

        function clearStoredFirstName() {
            localStorage.removeItem(CHAT_FIRST_NAME_KEY);

            showStoredFirstName();

            console.log('Stored first name cleared.');
        }

        /*
         * Receives the message sent by the custom
         * Salesforce pre-chat LWC.
         */
        window.addEventListener(
            'message',
            function (event) {
                console.log(
                    'Message event received:',
                    {
                        origin: event.origin,
                        data: event.data
                    }
                );

                if (
                    !event.data ||
                    event.data.type !==
                        'SAVE_CHAT_FIRST_NAME'
                ) {
                    return;
                }

                const firstName = String(
                    event.data.firstName || ''
                ).trim();

                if (!firstName) {
                    console.warn(
                        'SAVE_CHAT_FIRST_NAME was received, ' +
                        'but First Name was empty.'
                    );

                    return;
                }

                localStorage.setItem(
                    CHAT_FIRST_NAME_KEY,
                    firstName
                );

                console.log(
                    'First name saved to localStorage:',
                    firstName
                );

                showStoredFirstName();
            }
        );

        function initEmbeddedMessaging() {
            try {
                embeddedservice_bootstrap.settings.language =
                    'en_US';

                embeddedservice_bootstrap.init(
                    '00DVE000009G9YP',
                    'NitinTest',
                    'https://escoffier--uat.sandbox.my.site.com/ESWNitinTest1785021925679',
                    {
                        scrt2URL:
                            'https://escoffier--uat.sandbox.my.salesforce-scrt.com'
                    }
                );
            } catch (err) {
                console.error(
                    'Error loading Embedded Messaging:',
                    err
                );
            }
        }

        document.addEventListener(
            'DOMContentLoaded',
            showStoredFirstName
        );
    </script>

    <script
        type="text/javascript"
        src="https://escoffier--uat.sandbox.my.site.com/ESWNitinTest1785021925679/assets/js/bootstrap.min.js"
        onload="initEmbeddedMessaging()">
    </script>
</body>
</html>
