<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julienne Education Chat Test</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .page-header {
            display: flex;
            align-items: center;
            min-height: 76px;
            padding: 12px 24px;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }

        .page-header img {
            max-width: 220px;
            max-height: 64px;
            object-fit: contain;
        }

        .page-content {
            padding: 40px 24px;
            text-align: center;
        }

        #status {
            display: inline-block;
            max-width: 760px;
            margin-top: 18px;
            padding: 12px 16px;
            text-align: left;
            white-space: pre-wrap;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <header class="page-header">
        <img
            src="https://escoffier--uat.sandbox.my.site.com/resource/1784905312000/ChatLogoNew"
            alt="Auguste Escoffier School of Culinary Arts"
            onerror="this.onerror=null;this.src='https://escoffier--uat.sandbox.my.site.com/resource/ChatLogoNew';"
        >
    </header>

    <main class="page-content">
        <h1>Embedded Messaging Test</h1>
        <p>The chat launcher should appear in the lower-right corner.</p>
        <div id="status">Loading Salesforce Embedded Messaging…</div>
    </main>

    <script>
        const statusBox = document.getElementById("status");

        function setStatus(message) {
            statusBox.textContent += "\n" + message;
            console.log(message);
        }

        window.addEventListener("error", function (event) {
            setStatus("Browser error: " + (event.message || "Unknown error"));
        });

        window.addEventListener("unhandledrejection", function (event) {
            setStatus("Unhandled promise rejection: " + String(event.reason));
        });


        // Customer-data bridge for the custom pre-chat LWC.
        // This adds Phone support while keeping the previously working page unchanged.
        const CUSTOMER_STORAGE_KEY = "fsc_chatCustomerInfo";
        const REQUEST_CUSTOMER_INFO = "REQUEST_CHAT_CUSTOMER_INFO";
        const CUSTOMER_INFO_RESPONSE = "CHAT_CUSTOMER_INFO_RESPONSE";
        const SAVE_CUSTOMER_INFO = "SAVE_CHAT_CUSTOMER_INFO";

        function getStoredCustomerInfo() {
            try {
                const storedValue = window.localStorage.getItem(CUSTOMER_STORAGE_KEY);
                const customerInfo = storedValue ? JSON.parse(storedValue) : {};

                return {
                    firstName: String(customerInfo.firstName || "").trim(),
                    lastName: String(customerInfo.lastName || "").trim(),
                    email: String(customerInfo.email || "").trim(),
                    phone: String(customerInfo.phone || "").trim()
                };
            } catch (error) {
                console.error("Unable to read saved chat information:", error);
                return { firstName: "", lastName: "", email: "", phone: "" };
            }
        }

        function saveCustomerInfo(messageData) {
            const customerInfo = {
                firstName: String(messageData.firstName || "").trim(),
                lastName: String(messageData.lastName || "").trim(),
                email: String(messageData.email || "").trim(),
                phone: String(messageData.phone || "").trim()
            };

            try {
                window.localStorage.setItem(
                    CUSTOMER_STORAGE_KEY,
                    JSON.stringify(customerInfo)
                );
            } catch (error) {
                console.error("Unable to save chat information:", error);
            }
        }

        window.addEventListener("message", function (event) {
            const messageData = event.data;

            if (!messageData || typeof messageData !== "object") {
                return;
            }

            if (messageData.type === REQUEST_CUSTOMER_INFO) {
                const customerInfo = getStoredCustomerInfo();

                if (event.source && typeof event.source.postMessage === "function") {
                    event.source.postMessage(
                        {
                            type: CUSTOMER_INFO_RESPONSE,
                            firstName: customerInfo.firstName,
                            lastName: customerInfo.lastName,
                            email: customerInfo.email,
                            phone: customerInfo.phone
                        },
                        "*"
                    );
                }
                return;
            }

            if (messageData.type === SAVE_CUSTOMER_INFO) {
                saveCustomerInfo(messageData);
            }
        });

        window.addEventListener("onEmbeddedMessagingReady", function () {
            setStatus("Salesforce event received: onEmbeddedMessagingReady");

            try {
                if (
                    window.embeddedservice_bootstrap &&
                    embeddedservice_bootstrap.utilAPI &&
                    typeof embeddedservice_bootstrap.utilAPI.showChatButton === "function"
                ) {
                    embeddedservice_bootstrap.utilAPI.showChatButton();
                    setStatus("Requested Salesforce to show the chat button.");
                }
            } catch (error) {
                setStatus("Could not request chat-button visibility: " + error.message);
            }
        });

        function initEmbeddedMessaging() {
            try {
                setStatus("bootstrap.min.js loaded successfully.");

                embeddedservice_bootstrap.settings.language = "en_US";

                embeddedservice_bootstrap.init(
                    "00DVE000009G9YP",
                    "Julienne_edu",
                    "https://escoffier--uat.sandbox.my.site.com/ESWJulienneedu1777220225846",
                    {
                        scrt2URL:
                            "https://escoffier--uat.sandbox.my.salesforce-scrt.com"
                    }
                );

                setStatus("embeddedservice_bootstrap.init() was called.");
            } catch (error) {
                setStatus("Initialization error: " + error.message);
                console.error("Error loading Embedded Messaging:", error);
            }
        }

        function bootstrapLoadFailed() {
            setStatus(
                "bootstrap.min.js failed to load. Check the browser Console, CORS, CSP, deployment status, and URL."
            );
        }
    </script>

    <script
        type="text/javascript"
        src="https://escoffier--uat.sandbox.my.site.com/ESWJulienneedu1777220225846/assets/js/bootstrap.min.js"
        onload="initEmbeddedMessaging()"
        onerror="bootstrapLoadFailed()">
    </script>
</body>
</html>
