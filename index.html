<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Salesforce Pre-Chat Test</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            background: #eef4ff;
            border-radius: 6px;
            line-height: 1.8;
        }

        button {
            margin-top: 12px;
            margin-right: 8px;
            padding: 10px 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Embedded Messaging Test Page</h1>

        <p>
            Open the chat, enter your name and email, and start the conversation.
        </p>

        <div class="status">
            <div>
                Stored first name:
                <strong id="storedFirstName">None</strong>
            </div>

            <div>
                Stored last name:
                <strong id="storedLastName">None</strong>
            </div>

            <div>
                Stored email:
                <strong id="storedEmail">None</strong>
            </div>
        </div>

        <button
            type="button"
            onclick="showStoredCustomerInfo()"
        >
            Refresh Stored Values
        </button>

        <button
            type="button"
            onclick="clearStoredCustomerInfo()"
        >
            Clear Stored Values
        </button>
    </div>

    <script type="text/javascript">
        const CHAT_FIRST_NAME_KEY = 'chat_first_name';
        const CHAT_LAST_NAME_KEY = 'chat_last_name';
        const CHAT_EMAIL_KEY = 'chat_email';

        function showStoredCustomerInfo() {
            const firstName =
                localStorage.getItem(CHAT_FIRST_NAME_KEY);

            const lastName =
                localStorage.getItem(CHAT_LAST_NAME_KEY);

            const email =
                localStorage.getItem(CHAT_EMAIL_KEY);

            const firstNameElement =
                document.getElementById('storedFirstName');

            const lastNameElement =
                document.getElementById('storedLastName');

            const emailElement =
                document.getElementById('storedEmail');

            if (firstNameElement) {
                firstNameElement.textContent =
                    firstName || 'None';
            }

            if (lastNameElement) {
                lastNameElement.textContent =
                    lastName || 'None';
            }

            if (emailElement) {
                emailElement.textContent =
                    email || 'None';
            }

            console.log('Stored customer information:', {
                firstName,
                lastName,
                email
            });
        }

        function clearStoredCustomerInfo() {
            localStorage.removeItem(CHAT_FIRST_NAME_KEY);
            localStorage.removeItem(CHAT_LAST_NAME_KEY);
            localStorage.removeItem(CHAT_EMAIL_KEY);

            showStoredCustomerInfo();

            console.log(
                'Stored customer information cleared.'
            );
        }

        window.addEventListener('message', function (event) {
            console.log(
                'Message received by GitHub page:',
                event.origin,
                event.data
            );

            if (
                !event.data ||
                typeof event.data.type !== 'string'
            ) {
                return;
            }

            /*
             * Save values sent from the custom pre-chat LWC.
             */
            if (
                event.data.type ===
                'SAVE_CHAT_CUSTOMER_INFO'
            ) {
                const firstName = String(
                    event.data.firstName || ''
                ).trim();

                const lastName = String(
                    event.data.lastName || ''
                ).trim();

                const email = String(
                    event.data.email || ''
                ).trim();

                if (firstName) {
                    localStorage.setItem(
                        CHAT_FIRST_NAME_KEY,
                        firstName
                    );
                }

                if (lastName) {
                    localStorage.setItem(
                        CHAT_LAST_NAME_KEY,
                        lastName
                    );
                }

                if (email) {
                    localStorage.setItem(
                        CHAT_EMAIL_KEY,
                        email
                    );
                }

                console.log(
                    'Customer information saved to localStorage:',
                    {
                        firstName,
                        lastName,
                        email
                    }
                );

                showStoredCustomerInfo();

                return;
            }

            /*
             * The custom pre-chat LWC requests previously
             * stored customer information when it loads.
             */
            if (
                event.data.type ===
                'REQUEST_CHAT_CUSTOMER_INFO'
            ) {
                const firstName =
                    localStorage.getItem(
                        CHAT_FIRST_NAME_KEY
                    ) || '';

                const lastName =
                    localStorage.getItem(
                        CHAT_LAST_NAME_KEY
                    ) || '';

                const email =
                    localStorage.getItem(
                        CHAT_EMAIL_KEY
                    ) || '';

                if (!event.source) {
                    console.warn(
                        'Unable to respond because event.source is unavailable.'
                    );
                    return;
                }

                event.source.postMessage(
                    {
                        type:
                            'CHAT_CUSTOMER_INFO_RESPONSE',
                        firstName,
                        lastName,
                        email
                    },
                    '*'
                );

                console.log(
                    'Stored customer information sent back to pre-chat:',
                    {
                        firstName,
                        lastName,
                        email
                    }
                );
            }
        });

        function initEmbeddedMessaging() {
            try {
                embeddedservice_bootstrap.settings.language =
                    'en_US';

                embeddedservice_bootstrap.init(
                    '00DVE000009G9YP',
                    'NitinTest',
                    'https://escoffier--uat.sandbox.my.site.com/ESWNitinTest1785021925679',
                    {
                        scrt2URL:
                            'https://escoffier--uat.sandbox.my.salesforce-scrt.com'
                    }
                );
            } catch (error) {
                console.error(
                    'Error loading Embedded Messaging:',
                    error
                );
            }
        }

        document.addEventListener(
            'DOMContentLoaded',
            showStoredCustomerInfo
        );
    </script>

    <script
        type="text/javascript"
        src="https://escoffier--uat.sandbox.my.site.com/ESWNitinTest1785021925679/assets/js/bootstrap.min.js"
        onload="initEmbeddedMessaging()">
    </script>
</body>
</html>
