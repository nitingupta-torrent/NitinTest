<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #fff;
}

/* ================================
   CUSTOM LAUNCHER
   ================================ */

#julienneLauncher {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 999999;

    display: flex;
    align-items: center;
    gap: 10px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* White message bubble */

#julienneGreeting {
    position: relative;

    width: 180px;
    box-sizing: border-box;

    padding: 11px 13px;

    background: #fff;
    color: #241b1d;

    font-size: 13px;
    font-weight: 400;
    line-height: 1.4;

    border-radius: 14px;

    box-shadow:
        0 5px 16px rgba(0, 0, 0, 0.12);

    cursor: pointer;
}


/* Bubble tail */

#julienneGreeting::after {
    content: "";

    position: absolute;
    right: 22px;
    bottom: -8px;

    width: 0;
    height: 0;

    border-top: 9px solid #fff;
    border-left: 9px solid transparent;
}


/* Close button */

#julienneClose {
    position: absolute;

    top: -7px;
    right: -7px;

    width: 20px;
    height: 20px;

    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 50%;

    background: #c8102e;
    color: #fff;

    font-size: 17px;
    font-weight: 300;
    line-height: 1;

    cursor: pointer;
}


/* Red bot circle */

#julienneIcon {
    width: 52px;
    height: 52px;

    padding: 0;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 50%;

    background: #c8102e;

    cursor: pointer;
}


/* Bot icon */

#julienneIcon svg {
    width: 27px;
    height: 27px;
    stroke: #fff;
}


/* ================================
   MOBILE
   ================================ */

@media (max-width: 768px) {

    #julienneLauncher {
        right: 12px;
        bottom: 16px;
        gap: 8px;
    }

    #julienneGreeting {
        width: 165px;
        padding: 10px 12px;
        font-size: 12px;
        border-radius: 13px;
    }

    #julienneIcon {
        width: 48px;
        height: 48px;
    }

    #julienneIcon svg {
        width: 25px;
        height: 25px;
    }

    .embeddedMessagingFrame {
        position: fixed !important;
        top: auto !important;
        bottom: 1rem !important;

        height: 70dvh !important;
        max-height: 70dvh !important;

        transform: translateY(4vh) !important;
    }

    .embeddedMessagingFrame iframe {
        height: 100% !important;
        max-height: 100% !important;
    }
}
</style>
</head>

<body>


<div id="julienneLauncher">

    <div
        id="julienneGreeting"
        role="button"
        tabindex="0"
        aria-label="Open Julienne AI Assistant"
    >

        <button
            id="julienneClose"
            type="button"
            aria-label="Close greeting"
        >
            ×
        </button>

        Hi there, are there any questions I can answer for you?

    </div>


    <button
        id="julienneIcon"
        type="button"
        aria-label="Open Julienne AI Assistant"
    >

        <svg
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                d="M32 12V17"
                stroke-width="3"
                stroke-linecap="round"
            />

            <circle
                cx="32"
                cy="9"
                r="3"
                stroke-width="3"
            />

            <rect
                x="13"
                y="18"
                width="38"
                height="30"
                rx="11"
                stroke-width="3"
            />

            <circle
                cx="25"
                cy="32"
                r="3"
                fill="white"
                stroke="none"
            />

            <circle
                cx="39"
                cy="32"
                r="3"
                fill="white"
                stroke="none"
            />

            <path
                d="M25 41H39"
                stroke-width="3"
                stroke-linecap="round"
            />

            <path
                d="M23 49V54H41V49"
                stroke-width="3"
                stroke-linejoin="round"
            />

        </svg>

    </button>

</div>


<script>

const launcher =
    document.getElementById("julienneLauncher");

const greeting =
    document.getElementById("julienneGreeting");

const chatIcon =
    document.getElementById("julienneIcon");

const closeButton =
    document.getElementById("julienneClose");


const STORAGE_KEY =
    "fsc_chatCustomerInfo";

const REQUEST_INFO =
    "REQUEST_CHAT_CUSTOMER_INFO";

const RESPONSE_INFO =
    "CHAT_CUSTOMER_INFO_RESPONSE";

const SAVE_INFO =
    "SAVE_CHAT_CUSTOMER_INFO";


/* Customer info for Pre-Chat LWC */

window.addEventListener("message", event => {

    const data = event.data;

    if (!data || typeof data !== "object") {
        return;
    }


    if (data.type === REQUEST_INFO) {

        let customer = {};

        try {

            customer =
                JSON.parse(
                    localStorage.getItem(STORAGE_KEY) || "{}"
                );

        } catch (e) {

            customer = {};

        }


        const firstName =
            String(customer.firstName || "").trim();

        const lastName =
            String(customer.lastName || "").trim();

        const email =
            String(customer.email || "").trim();

        const phone =
            String(customer.phone || "").trim();


        event.source?.postMessage(
            {
                type: RESPONSE_INFO,

                firstName,
                lastName,
                email,
                phone,

                isReturningCustomer:
                    !!(
                        firstName &&
                        lastName &&
                        email &&
                        phone
                    )
            },
            "*"
        );
    }


    if (data.type === SAVE_INFO) {

        localStorage.setItem(
            STORAGE_KEY,

            JSON.stringify({
                firstName:
                    String(data.firstName || "").trim(),

                lastName:
                    String(data.lastName || "").trim(),

                email:
                    String(data.email || "").trim(),

                phone:
                    String(data.phone || "").trim()
            })
        );
    }

});


/* Open chat */

function openChat() {

    if (
        !embeddedservice_bootstrap
            ?.utilAPI
            ?.launchChat
    ) {
        return;
    }

    launcher.style.display = "none";

    embeddedservice_bootstrap
        .utilAPI
        .launchChat()
        .catch(() => {

            launcher.style.display = "flex";

        });
}


/* Hide standard Salesforce button */

function hideSalesforceButton() {

    try {

        embeddedservice_bootstrap
            ?.utilAPI
            ?.hideChatButton();

    } catch (e) {}

}


/* Greeting opens chat */

greeting.addEventListener(
    "click",
    openChat
);


/* Bot opens chat */

chatIcon.addEventListener(
    "click",
    openChat
);


/* Keyboard */

greeting.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            openChat();
        }
    }
);


/* X hides greeting only */

closeButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        greeting.style.display = "none";
    }
);


/* Salesforce events */

window.addEventListener(
    "onEmbeddedMessagingButtonCreated",
    () => {

        hideSalesforceButton();

        launcher.style.display = "flex";
    }
);


window.addEventListener(
    "onEmbeddedMessagingReady",
    () => {

        hideSalesforceButton();

        launcher.style.display = "flex";

        setTimeout(
            hideSalesforceButton,
            500
        );

        setTimeout(
            hideSalesforceButton,
            1500
        );
    }
);


window.addEventListener(
    "onEmbeddedMessagingWindowOpened",
    () => {

        launcher.style.display = "none";
    }
);


window.addEventListener(
    "onEmbeddedMessagingWindowClosed",
    () => {

        setTimeout(() => {

            hideSalesforceButton();

            launcher.style.display = "flex";

        }, 100);
    }
);


/* Salesforce initialization */

function initEmbeddedMessaging() {

    try {

        embeddedservice_bootstrap
            .settings
            .language = "en_US";

        embeddedservice_bootstrap
            .settings
            .restrictSessionOnMessagingChannel = true;

        embeddedservice_bootstrap
            .settings
            .hideChatButtonOnLoad = true;


        embeddedservice_bootstrap.init(

            "00D6A000000w629",

            "Julienne_edu_1",

            "https://escoffier.my.site.com/ESWJulienneedu11787765871616",

            {
                scrt2URL:
                    "https://escoffier.my.salesforce-scrt.com"
            }

        );

    } catch (e) {

        console.error(
            "Error loading Embedded Messaging:",
            e
        );
    }
}

</script>


<script
    src="https://escoffier.my.site.com/ESWJulienneedu11787765871616/assets/js/bootstrap.min.js"
    onload="initEmbeddedMessaging()">
</script>


</body>
</html>
