<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat</title>
</head>

<body>
    <script type="text/javascript">
        const CHAT_FIRST_NAME_KEY = 'chat_first_name';
        const CHAT_LAST_NAME_KEY = 'chat_last_name';
        const CHAT_EMAIL_KEY = 'chat_email';

        window.addEventListener('message', function (event) {
            if (
                !event.data ||
                typeof event.data.type !== 'string'
            ) {
                return;
            }

            if (
                event.data.type ===
                'SAVE_CHAT_CUSTOMER_INFO'
            ) {
                const firstName = String(
                    event.data.firstName || ''
                ).trim();

                const lastName = String(
                    event.data.lastName || ''
                ).trim();

                const email = String(
                    event.data.email || ''
                ).trim();

                if (firstName) {
                    localStorage.setItem(
                        CHAT_FIRST_NAME_KEY,
                        firstName
                    );
                }

                if (lastName) {
                    localStorage.setItem(
                        CHAT_LAST_NAME_KEY,
                        lastName
                    );
                }

                if (email) {
                    localStorage.setItem(
                        CHAT_EMAIL_KEY,
                        email
                    );
                }

                return;
            }

            if (
                event.data.type ===
                'REQUEST_CHAT_CUSTOMER_INFO'
            ) {
                const firstName =
                    localStorage.getItem(
                        CHAT_FIRST_NAME_KEY
                    ) || '';

                const lastName =
                    localStorage.getItem(
                        CHAT_LAST_NAME_KEY
                    ) || '';

                const email =
                    localStorage.getItem(
                        CHAT_EMAIL_KEY
                    ) || '';

                if (!event.source) {
                    return;
                }

                event.source.postMessage(
                    {
                        type:
                            'CHAT_CUSTOMER_INFO_RESPONSE',
                        firstName,
                        lastName,
                        email
                    },
                    '*'
                );
            }
        });

        function initEmbeddedMessaging() {
            try {
                embeddedservice_bootstrap.settings.language =
                    'en_US';

                embeddedservice_bootstrap.init(
                    '00DVE000009G9YP',
                    'NitinTest',
                    'https://escoffier--uat.sandbox.my.site.com/ESWNitinTest1785021925679',
                    {
                        scrt2URL:
                            'https://escoffier--uat.sandbox.my.salesforce-scrt.com'
                    }
                );
            } catch (error) {
                console.error(
                    'Error loading Embedded Messaging:',
                    error
                );
            }
        }
    </script>

    <script
        type="text/javascript"
        src="https://escoffier--uat.sandbox.my.site.com/ESWNitinTest1785021925679/assets/js/bootstrap.min.js"
        onload="initEmbeddedMessaging()">
    </script>
</body>
</html>
