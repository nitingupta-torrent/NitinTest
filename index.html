<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
        }

        /* =====================================================
           CUSTOM JULIENNE LAUNCHER
           ===================================================== */

        #julienneLauncherWrapper {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 999999;

            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        #julienneLauncher {
            height: 62px;
            padding: 0 22px 0 14px;

            display: flex;
            align-items: center;
            gap: 14px;

            border: none;
            border-radius: 31px;

            background: #c8102e;
            color: #ffffff;

            cursor: pointer;

            box-shadow: 0 4px 12px rgba(0,0,0,.20);

            font-family: Arial, Helvetica, sans-serif;
        }

        #julienneLauncher:hover {
            background: #ad0d28;
        }

        .julienne-logo {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 45px;
            height: 45px;

            padding-right: 12px;

            border-right: 1px solid rgba(255,255,255,.65);

            font-family: Georgia, serif;
            font-size: 32px;

            color: #ffffff;
        }

        .julienne-launcher-text {
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* =====================================================
           GREETING
           ===================================================== */

        #julienneGreeting {
            position: relative;

            box-sizing: border-box;
            width: 285px;

            margin-top: 8px;
            padding: 14px 18px;

            background: #ffffff;
            color: #222222;

            border-radius: 18px;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.35;

            box-shadow: 0 3px 12px rgba(0,0,0,.18);
        }

        #julienneGreeting::before {
            content: "";

            position: absolute;

            top: -8px;
            right: 38px;

            width: 16px;
            height: 16px;

            background: #ffffff;

            transform: rotate(45deg);
        }

        /* =====================================================
           MOBILE CHAT WINDOW
           ===================================================== */

        @media only screen and (max-width: 768px) {

            .embeddedMessagingFrame {
                position: fixed !important;

                bottom: 1rem !important;
                top: auto !important;

                height: 70dvh !important;
                max-height: 70dvh !important;

                transform: translateY(4vh) !important;
            }

            .embeddedMessagingFrame iframe {
                height: 100% !important;
                max-height: 100% !important;
            }

            #julienneLauncherWrapper {
                right: 14px;
                bottom: 18px;
            }

            #julienneLauncher {
                height: 54px;
                padding: 0 16px 0 10px;
                gap: 10px;
            }

            .julienne-logo {
                width: 38px;
                height: 38px;

                padding-right: 9px;

                font-size: 27px;
            }

            .julienne-launcher-text {
                font-size: 15px;
            }

            #julienneGreeting {
                width: 260px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<div id="julienneLauncherWrapper">

    <button
        id="julienneLauncher"
        type="button"
        aria-label="Open Julienne AI Assistant"
    >
        <span class="julienne-logo">
               <img

        src="https://escoffier--uat.sandbox.my.site.com/ESWJulienneedu1777220444593/sfsites/c/resource/1789478732000/ChatLogoNew"

        alt="Julienne AI Assistant"

    >
        </span>

        <span class="julienne-launcher-text">
            Julienne AI Assistant
        </span>
    </button>

    <div id="julienneGreeting">
        Hi there! Are there any questions that I can answer for you?
    </div>

</div>


<script type="text/javascript">

    /* =====================================================
       CONSTANTS
       ===================================================== */

    const CUSTOMER_STORAGE_KEY =
        "fsc_chatCustomerInfo";

    const REQUEST_CUSTOMER_INFO =
        "REQUEST_CHAT_CUSTOMER_INFO";

    const CUSTOMER_INFO_RESPONSE =
        "CHAT_CUSTOMER_INFO_RESPONSE";

    const SAVE_CUSTOMER_INFO =
        "SAVE_CHAT_CUSTOMER_INFO";


    const wrapper =
        document.getElementById(
            "julienneLauncherWrapper"
        );

    const launcher =
        document.getElementById(
            "julienneLauncher"
        );


    /* =====================================================
       CUSTOMER STORAGE
       ===================================================== */

    function getStoredCustomerInfo() {

        try {

            const storedValue =
                window.localStorage.getItem(
                    CUSTOMER_STORAGE_KEY
                );

            const customerInfo =
                storedValue
                    ? JSON.parse(storedValue)
                    : {};

            return {

                firstName: String(
                    customerInfo.firstName || ""
                ).trim(),

                lastName: String(
                    customerInfo.lastName || ""
                ).trim(),

                email: String(
                    customerInfo.email || ""
                ).trim(),

                phone: String(
                    customerInfo.phone || ""
                ).trim()

            };

        } catch (error) {

            console.error(
                "Unable to read saved chat information:",
                error
            );

            return {
                firstName: "",
                lastName: "",
                email: "",
                phone: ""
            };
        }
    }


    function isReturningCustomer(customerInfo) {

        return Boolean(
            customerInfo.firstName &&
            customerInfo.lastName &&
            customerInfo.email &&
            customerInfo.phone
        );
    }


    function saveCustomerInfo(messageData) {

        const customerInfo = {

            firstName: String(
                messageData.firstName || ""
            ).trim(),

            lastName: String(
                messageData.lastName || ""
            ).trim(),

            email: String(
                messageData.email || ""
            ).trim(),

            phone: String(
                messageData.phone || ""
            ).trim()

        };

        try {

            window.localStorage.setItem(
                CUSTOMER_STORAGE_KEY,
                JSON.stringify(customerInfo)
            );

        } catch (error) {

            console.error(
                "Unable to save chat information:",
                error
            );
        }
    }


    /* =====================================================
       PRECHAT COMMUNICATION
       ===================================================== */

    window.addEventListener(
        "message",
        function(event) {

            const messageData =
                event.data;

            if (
                !messageData ||
                typeof messageData !== "object"
            ) {
                return;
            }


            if (
                messageData.type ===
                REQUEST_CUSTOMER_INFO
            ) {

                const customerInfo =
                    getStoredCustomerInfo();

                const returningCustomer =
                    isReturningCustomer(
                        customerInfo
                    );

                if (
                    event.source &&
                    typeof event.source.postMessage ===
                        "function"
                ) {

                    event.source.postMessage(
                        {
                            type:
                                CUSTOMER_INFO_RESPONSE,

                            firstName:
                                customerInfo.firstName,

                            lastName:
                                customerInfo.lastName,

                            email:
                                customerInfo.email,

                            phone:
                                customerInfo.phone,

                            isReturningCustomer:
                                returningCustomer
                        },
                        "*"
                    );
                }

                return;
            }


            if (
                messageData.type ===
                SAVE_CUSTOMER_INFO
            ) {

                saveCustomerInfo(
                    messageData
                );
            }
        }
    );


    /* =====================================================
       SHOW/HIDE CUSTOM LAUNCHER
       ===================================================== */

    function showCustomLauncher() {

        wrapper.style.display =
            "flex";
    }


    function hideCustomLauncher() {

        wrapper.style.display =
            "none";
    }


    /* =====================================================
       HIDE SALESFORCE DEFAULT LAUNCHER
       ===================================================== */

    function hideSalesforceLauncher() {

        try {

            if (
                window.embeddedservice_bootstrap &&
                embeddedservice_bootstrap.utilAPI &&
                typeof embeddedservice_bootstrap
                    .utilAPI
                    .hideChatButton === "function"
            ) {

                embeddedservice_bootstrap
                    .utilAPI
                    .hideChatButton();

            }

        } catch (error) {

            console.log(
                "Salesforce launcher could not be hidden yet:",
                error
            );
        }
    }


    /* =====================================================
       CUSTOM BUTTON CLICK
       ===================================================== */

    launcher.addEventListener(
        "click",
        function() {

            try {

                if (
                    window.embeddedservice_bootstrap &&
                    embeddedservice_bootstrap.utilAPI &&
                    typeof embeddedservice_bootstrap
                        .utilAPI
                        .launchChat === "function"
                ) {

                    hideCustomLauncher();

                    embeddedservice_bootstrap
                        .utilAPI
                        .launchChat()

                        .catch(
                            function(error) {

                                console.error(
                                    "Unable to launch chat:",
                                    error
                                );

                                showCustomLauncher();
                            }
                        );

                } else {

                    console.log(
                        "Embedded Messaging is still loading."
                    );
                }

            } catch (error) {

                console.error(
                    "Unable to launch chat:",
                    error
                );

                showCustomLauncher();
            }
        }
    );


    /* =====================================================
       SALESFORCE BUTTON CREATED
       IMPORTANT FOR REFRESH / RESTORED SESSION
       ===================================================== */

    window.addEventListener(
        "onEmbeddedMessagingButtonCreated",
        function() {

            console.log(
                "Salesforce messaging button created."
            );

            /*
             * Salesforce can recreate its default launcher
             * after refresh when an active session exists.
             *
             * Hide it again.
             */

            hideSalesforceLauncher();


            /*
             * Keep Julienne launcher visible.
             */

            showCustomLauncher();
        }
    );


    /* =====================================================
       EMBEDDED MESSAGING READY
       ===================================================== */

    window.addEventListener(
        "onEmbeddedMessagingReady",
        function() {

            console.log(
                "Embedded Messaging ready."
            );

            /*
             * Try again because on refresh Salesforce
             * may rebuild its own launcher.
             */

            hideSalesforceLauncher();

            showCustomLauncher();


            /*
             * Small delayed retry.
             * Useful when Salesforce restores a session
             * slightly after the ready event.
             */

            setTimeout(
                function() {

                    hideSalesforceLauncher();

                },
                500
            );


            setTimeout(
                function() {

                    hideSalesforceLauncher();

                },
                1500
            );
        }
    );


    /* =====================================================
       CHAT WINDOW OPENED
       ===================================================== */

    window.addEventListener(
        "onEmbeddedMessagingWindowOpened",
        function() {

            console.log(
                "Messaging window opened."
            );

            hideCustomLauncher();
        }
    );


    /* =====================================================
       CHAT WINDOW CLOSED / MINIMIZED
       ===================================================== */

    window.addEventListener(
        "onEmbeddedMessagingWindowClosed",
        function() {

            console.log(
                "Messaging window closed."
            );

            /*
             * Salesforce may recreate its normal button
             * when the window closes/minimizes.
             */

            setTimeout(
                function() {

                    hideSalesforceLauncher();

                    showCustomLauncher();

                },
                100
            );
        }
    );


    /* =====================================================
       INITIALIZE EMBEDDED MESSAGING
       ===================================================== */

    function initEmbeddedMessaging() {

        try {

            embeddedservice_bootstrap
                .settings
                .language =
                "en_US";


            embeddedservice_bootstrap
                .settings
                .restrictSessionOnMessagingChannel =
                true;


            /*
             * Initial Salesforce launcher should be hidden.
             */

            embeddedservice_bootstrap
                .settings
                .hideChatButtonOnLoad =
                true;


            embeddedservice_bootstrap.init(

                "00D6A000000w629",

                "Julienne_edu_1",

                "https://escoffier.my.site.com/ESWJulienneedu11787765871616",

                {
                    scrt2URL:
                        "https://escoffier.my.salesforce-scrt.com"
                }

            );

        } catch (err) {

            console.error(
                "Error loading Embedded Messaging:",
                err
            );
        }
    }

</script>


<script
    type="text/javascript"
    src="https://escoffier.my.site.com/ESWJulienneedu11787765871616/assets/js/bootstrap.min.js"
    onload="initEmbeddedMessaging()">
</script>

</body>
</html>
