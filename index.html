<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #fff;
    }

    /* Custom launcher */
    #julienneLauncher {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 150px;
        z-index: 999999;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(0,0,0,.18);
        font-family: Arial, sans-serif;
        cursor: pointer;
    }

    #julienneHeader {
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #c8102e;
        color: #fff;
        font-size: 13px;
        font-weight: 400;
    }

    #julienneGreeting {
        padding: 11px 13px;
        background: #fff;
        color: #222;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.4;
    }

    @media (max-width: 768px) {
        #julienneLauncher {
            right: 14px;
            bottom: 18px;
        }

        .embeddedMessagingFrame {
            position: fixed !important;
            top: auto !important;
            bottom: 1rem !important;
            height: 70dvh !important;
            max-height: 70dvh !important;
            transform: translateY(4vh) !important;
        }

        .embeddedMessagingFrame iframe {
            height: 100% !important;
            max-height: 100% !important;
        }
    }
</style>
</head>

<body>

<div id="julienneLauncher" role="button" tabindex="0">
    <div id="julienneHeader">
        Julienne AI Assistant
    </div>

    <div id="julienneGreeting">
        Hi there! Are there any questions that I can answer for you?
    </div>
</div>


<script>
const launcher = document.getElementById("julienneLauncher");

const STORAGE_KEY = "fsc_chatCustomerInfo";
const REQUEST_INFO = "REQUEST_CHAT_CUSTOMER_INFO";
const RESPONSE_INFO = "CHAT_CUSTOMER_INFO_RESPONSE";
const SAVE_INFO = "SAVE_CHAT_CUSTOMER_INFO";


/* Customer info for your Pre-Chat LWC */
window.addEventListener("message", event => {

    const data = event.data;

    if (!data || typeof data !== "object") return;


    if (data.type === REQUEST_INFO) {

        let customer = {};

        try {
            customer = JSON.parse(
                localStorage.getItem(STORAGE_KEY) || "{}"
            );
        } catch (e) {
            customer = {};
        }

        const firstName = String(customer.firstName || "").trim();
        const lastName  = String(customer.lastName || "").trim();
        const email     = String(customer.email || "").trim();
        const phone     = String(customer.phone || "").trim();

        event.source?.postMessage({
            type: RESPONSE_INFO,
            firstName,
            lastName,
            email,
            phone,
            isReturningCustomer:
                !!(firstName && lastName && email && phone)
        }, "*");
    }


    if (data.type === SAVE_INFO) {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
                firstName: String(data.firstName || "").trim(),
                lastName:  String(data.lastName || "").trim(),
                email:     String(data.email || "").trim(),
                phone:     String(data.phone || "").trim()
            })
        );
    }
});


/* Open chat */
function openChat() {

    if (!embeddedservice_bootstrap?.utilAPI?.launchChat) return;

    launcher.style.display = "none";

    embeddedservice_bootstrap.utilAPI
        .launchChat()
        .catch(() => launcher.style.display = "block");
}


/* Hide Salesforce's standard red button */
function hideSalesforceButton() {

    try {
        embeddedservice_bootstrap?.utilAPI?.hideChatButton();
    } catch (e) {}
}


/* Entire custom box opens chat */
launcher.addEventListener("click", openChat);

launcher.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openChat();
    }
});


/* Salesforce events */
window.addEventListener("onEmbeddedMessagingButtonCreated", () => {
    hideSalesforceButton();
    launcher.style.display = "block";
});


window.addEventListener("onEmbeddedMessagingReady", () => {

    hideSalesforceButton();
    launcher.style.display = "block";

    /* Needed when Salesforce restores a session after refresh */
    setTimeout(hideSalesforceButton, 500);
    setTimeout(hideSalesforceButton, 1500);
});


window.addEventListener("onEmbeddedMessagingWindowOpened", () => {
    launcher.style.display = "none";
});


window.addEventListener("onEmbeddedMessagingWindowClosed", () => {

    setTimeout(() => {
        hideSalesforceButton();
        launcher.style.display = "block";
    }, 100);
});


/* Salesforce initialization */
function initEmbeddedMessaging() {

    try {

        embeddedservice_bootstrap.settings.language = "en_US";
        embeddedservice_bootstrap.settings.restrictSessionOnMessagingChannel = true;
        embeddedservice_bootstrap.settings.hideChatButtonOnLoad = true;

        embeddedservice_bootstrap.init(
            "00D6A000000w629",
            "Julienne_edu_1",
            "https://escoffier.my.site.com/ESWJulienneedu11787765871616",
            {
                scrt2URL:
                    "https://escoffier.my.salesforce-scrt.com"
            }
        );

    } catch (e) {
        console.error("Error loading Embedded Messaging:", e);
    }
}
</script>


<script
    src="https://escoffier.my.site.com/ESWJulienneedu11787765871616/assets/js/bootstrap.min.js"
    onload="initEmbeddedMessaging()">
</script>

</body>
</html>
